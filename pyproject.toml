[project]
name = "vps-ops-toolkit"
version = "0.1.0"
description = "Python toolkit for VPS and Docker operations monitoring."
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "typer",
    "rich",
    "psutil"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[project.scripts]
vps-ops = "vps_ops_toolkit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]